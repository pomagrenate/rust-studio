[package]
name = "pomai-lldb-sys"
version = "0.1.0"
edition = "2021"
authors = ["Pomai Systems Team"]
description = "Native LLDB system bindings for Pomai Studio Debug Engine"
links = "lldb"

[dependencies]
bitflags = "2.0"
cpp = "0.5"
lazy_static = "1.3.0"
libc = "0.2"
num_enum = "0.7.4"

[build-dependencies]
cpp_build = "0.5"
regex = "1.9"

[features]
no_link_args = []
